<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="in car">
  <meta name="theme-color" content="#0F1B2D">
  <title>in car</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <style>
    html, body { margin: 0; height: 100%; background: #0F1B2D; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
              justify-content: center; gap: 18px; color: #fff; font-family: system-ui, sans-serif; }
    #splash b { font-size: 34px; }
    #splash span { color: #C9D2E0; font-size: 15px; }
    #bar { width: 160px; height: 5px; border-radius: 3px; background: #24344F; overflow: hidden; }
    #bar i { display: block; height: 100%; width: 40%; background: #F2A516; border-radius: 3px;
             animation: s 1.2s ease-in-out infinite; }
    @keyframes s { from { transform: translateX(160px); } to { transform: translateX(-160px); } }
  </style>
</head>
<body>
  <div id="splash"><b>in car</b><div id="bar"><i></i></div><span id="msg">قاعد يحمّل… أول مرة ممكن ياخذ دقيقة</span>
    <pre id="err" style="display:none;max-width:90vw;white-space:pre-wrap;font-size:12px;color:#FFB4A8;direction:ltr;text-align:left"></pre>
    <button id="again" onclick="location.reload()" style="display:none;padding:12px 22px;border:0;border-radius:12px;background:#F2A516;color:#0F1B2D;font-size:16px;font-weight:700">عاود حمّل</button>
  </div>
  <script>
    var started = false;
    function showProblem(text) {
      if (started) return;
      document.getElementById('msg').textContent = 'التحميل وقف. صوّر الشاشة هذي وابعتها للدعم:';
      var e = document.getElementById('err'); e.style.display = 'block';
      e.textContent = (e.textContent ? e.textContent + '\n' : '') + text;
      document.getElementById('again').style.display = 'inline-block';
    }
    window.addEventListener('error', function (ev) {
      showProblem((ev.message || 'error') + (ev.filename ? ' @ ' + ev.filename.split('/').pop() + ':' + ev.lineno : ''));
    }, true);
    window.addEventListener('unhandledrejection', function (ev) {
      showProblem('promise: ' + (ev.reason && (ev.reason.message || ev.reason)));
    });
    setTimeout(function () {
      if (!started) showProblem('timeout 90s · ' + navigator.userAgent + ' · wasm=' + (typeof WebAssembly));
    }, 90000);
    window.addEventListener('flutter-first-frame', function () {
      started = true;
      var s = document.getElementById('splash'); if (s) s.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
